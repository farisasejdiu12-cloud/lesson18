
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 2D Transforms and Transitions</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f4f8;
            padding: 50px;
        }

        h1 {
            color: #263238;
        }

        .box {
            width: 200px;
            height: 150px;
            margin: 60px auto;
            background-color: #3498db;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            font-size: 20px;

            /* CSS 2D Transform */
            transform: rotate(0deg) scale(1);

            /* CSS Transition */
            transition: transform 0.5s ease,
                        background-color 0.5s ease;
        }

        /* Apply transformation on hover */
        .box:hover {
            transform: rotate(10deg) scale(1.2);
            background-color: #e67e22;
        }
    </style>
</head>

<body>
    <h1>CSS 2D Transforms and Transitions</h1>

    <p>Move your mouse over the box to see the effect!</p>

    <div class="box">
        Hover Over Me!
    </div>
</body>
</html>
